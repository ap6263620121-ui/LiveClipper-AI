
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveClipper AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #090817;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 600px;
  margin: auto;
}

header {
  text-align: center;
  padding: 25px 0;
}

.logo {
  font-size: 30px;
  font-weight: bold;
  color: #b78aff;
}

header p {
  color: #aaa;
}

.card {
  background: #17142b;
  padding: 22px;
  border: 1px solid #393054;
  border-radius: 18px;
  margin-bottom: 18px;
}

h2 {
  font-size: 20px;
}

input, select {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #51456f;
  background: #0d0b1c;
  color: white;
  margin: 12px 0;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #873eff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}

button:active {
  opacity: 0.8;
}

.info {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.tag {
  background: #30244d;
  padding: 10px 14px;
  border-radius: 20px;
  color: #d9c4ff;
  font-size: 13px;
}

video {
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
}

#status {
  color: #65d9ff;
  margin-top: 15px;
  line-height: 1.5;
}

footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  padding: 20px;
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="logo">⚡ LiveClipper AI</div>
  <p>90 Second Video Clipper</p>
  <h2>Welcome to LiveClipper AI</h2>
</header>

<div class="card">
  <h2>🎬 Add Your Video</h2>

  <p>Paste Your YouTube video link</p>

  <input
    id="videoLink"
    type="url"
    placeholder="https://www.youtube.com/watch?v=..."
  >

  <button onclick="checkLink()">
    Continue
  </button>

  <p style="text-align:center;color:#aaa">OR</p>

  <p>Upload your own video</p>

  <input
    id="videoFile"
    type="file"
    accept="video/*"
  >

  <video id="preview" controls hidden></video>
</div>

<div class="card">
  <h2>⚙️ Clip Settings</h2>

  <div class="info">
    <span class="tag">90 Seconds</span>
    <span class="tag">1080p Full HD</span>
    <span class="tag">AI Clipping</span>
  </div>

  <label for="duration">Clip Duration</label>
  <select id="duration">
    <option value="30">30 Seconds</option>
    <option value="60">60 Seconds</option>
    <option value="90" selected>90 Seconds</option>
  </select>

  <label for="quality">Video Quality</label>
  <select id="quality">
    <option value="720">720p HD</option>
    <option value="1080" selected>1080p Full HD</option>
  </select>

  <button onclick="generate()">
    ✨ Generate Clips
  </button>

  <div id="status"></div>
</div>

<footer>
  LiveClipper AI • Video Clipping Studio
</footer>

</div>

<script>

function checkLink() {
  const link = document.getElementById("videoLink").value.trim();
  const status = document.getElementById("status");

  if (!link) {
    status.textContent = "Please paste a video link first.";
    return;
  }

  try {
    const url = new URL(link);
    const valid =
      (url.hostname === "youtube.com" ||
       url.hostname === "www.youtube.com" ||
       url.hostname === "m.youtube.com" ||
       url.hostname === "youtu.be") &&
      (url.hostname === "youtu.be"
        ? url.pathname.length > 1
        : url.pathname === "/watch" &&
          url.searchParams.has("v"));

    if (!valid) {
      status.textContent = "Please enter a valid YouTube video URL.";
      return;
    }

    status.textContent =
      "YouTube link received! Connect a video processing backend to continue.";

  } catch (error) {
    status.textContent = "Please enter a valid video URL.";
  }
}

document.getElementById("videoFile")
.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  if (!file.type.startsWith("video/")) {
    document.getElementById("status").textContent =
      "Please select a valid video file.";
    return;
  }

  const preview = document.getElementById("preview");

  if (preview.dataset.url) {
    URL.revokeObjectURL(preview.dataset.url);
  }

  const videoURL = URL.createObjectURL(file);

  preview.src = videoURL;
  preview.dataset.url = videoURL;
  preview.hidden = false;

  document.getElementById("status").textContent =
    "Video loaded successfully!";

});

function generate() {

  const file = document.getElementById("videoFile").files[0];
  const link = document.getElementById("videoLink").value.trim();
  const status = document.getElementById("status");

  if (!file && !link) {
    status.textContent = "Please upload a video or paste a YouTube link.";
    return;
  }

  if (!file) {
    checkLink();
    return;
  }

  status.textContent =
    "Your clip settings are ready. AI processing and MP4 export will be connected in the next development step.";

}

</script>
</body>
</html>
